# Build GameNative Proton Wine 11.0-2 arm64ec (Android/bionic) with the patches
# from patches/ applied on top.
#
# The build steps are the aarch64 leg of GameNative's own workflow
# (https://github.com/GameNative/proton-wine/blob/proton_11.0-2/.github/workflows/build-proton.yml),
# with the sources pinned to the commit of release proton-11.0-2-20261010.
name: Build Proton 11.0-2 arm64ec (patched)

on:
  push:
    branches: [ 'claude/**', main, master ]
  workflow_dispatch:

env:
  PROTON_WINE_REPO: GameNative/proton-wine
  PROTON_WINE_REF: f323a4d3eb4387bab684710ca1b38251ca7854e1   # proton_11.0-2, release proton-11.0-2-20261010
  NTSYNC_ANDROID_REF: 7ce6435e5979b1cb5341aa4b299f31e8937fe121 # commit named in that release's notes
  PROTON_VERSION: 11.0-2-fix
  ARCH_NAME: arm64ec

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Check out Proton Wine sources
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PROTON_WINE_REPO }}
          ref: ${{ env.PROTON_WINE_REF }}
          submodules: recursive

      - name: Check out patches
        uses: actions/checkout@v4
        with:
          path: fix

      - name: Check that the patches apply to the pristine sources
        run: |
          for p in fix/patches/*.patch; do
            echo "== $p"
            git apply --check -v "$p"
          done

      - name: Set up build environment
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            unzip \
            flex \
            bison \
            gettext \
            autoconf \
            automake \
            libtool \
            pkg-config \
            ccache \
            zstd \
            mingw-w64 \
            gcc-multilib \
            g++-multilib \
            libfreetype6-dev \
            libfreetype6-dev:i386 \
            libpng-dev \
            libpng-dev:i386 \
            zlib1g-dev \
            zlib1g-dev:i386

      - name: Download and extract termuxfs for aarch64
        run: |
          mkdir -p $HOME/termuxfs/aarch64
          cd $HOME/termuxfs/aarch64
          wget -q https://github.com/GameNative/termux-on-gha/releases/download/build-20260218/termuxfs-aarch64.tar
          tar -xf termuxfs-aarch64.tar

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ~/Android/Sdk/ndk/27.3.13750724
          key: android-ndk-r27d

      - name: Set up Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/Android/Sdk/ndk
          cd $HOME/Android/Sdk/ndk
          wget -q https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          mv android-ndk-r27d 27.3.13750724

      - name: Cache LLVM MinGW toolchain
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: ~/toolchains/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64
          key: bylaws-llvm-mingw-20250920

      - name: Set up LLVM MinGW toolchain
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget -q https://github.com/bylaws/llvm-mingw/releases/download/20250920/llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz
          tar -xf llvm-mingw-20250920-ucrt-ubuntu-22.04-x86_64.tar.xz

      - name: Check out ntsync-android (userspace ntsync)
        uses: actions/checkout@v4
        with:
          repository: GameNative/ntsync-android
          ref: ${{ env.NTSYNC_ANDROID_REF }}
          path: ntsync-android

      - name: Set up Rust for ntsync-android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-p11-fix-aarch64-${{ github.sha }}
          restore-keys: |
            ccache-p11-fix-aarch64-

      - name: Run autogen.sh
        run: bash autogen.sh

      - name: Cache wine-tools
        id: cache-wine-tools
        uses: actions/cache@v4
        with:
          path: wine-tools
          key: wine-tools-${{ env.PROTON_WINE_REF }}-${{ hashFiles('configure.ac', 'configure') }}

      - name: Build wine-tools (step 0)
        if: steps.cache-wine-tools.outputs.cache-hit != 'true'
        run: bash build-scripts/build-step0.sh

      - name: Build sysvshm library
        run: bash build-scripts/build-step-arm64ec.sh --build-sysvshm

      - name: Build ntsync-android library
        env:
          NTSYNC_ANDROID_DIR: ${{ github.workspace }}/ntsync-android
        run: bash build-scripts/build-step-arm64ec.sh --build-ntsync-android

      # --configure also applies GameNative's android/patches series.
      - name: Configure
        run: bash build-scripts/build-step-arm64ec.sh --configure

      - name: Apply patches
        run: |
          for p in fix/patches/*.patch; do
            echo "== $p"
            git apply -v "$p"
          done
          grep -n '0x7ffe1000' include/wine/asm.h dlls/ntdll/unix/signal_arm64.c

      - name: Build
        run: bash build-scripts/build-step-arm64ec.sh --build

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: Install
        run: bash build-scripts/build-step-arm64ec.sh --install

      - name: Verify the syscall thunks in the built ntdll
        run: |
          find $HOME/compiled-files-aarch64/lib/wine -name ntdll.dll
          python3 fix/scripts/check-thunks.py $HOME/compiled-files-aarch64/lib/wine/aarch64-windows/ntdll.dll

      - name: Download prefixPack.txz
        run: wget -q https://github.com/GameNative/bionic-prefix-files/raw/main/prefixPack-arm64ec-11.txz -O $GITHUB_WORKSPACE/prefixPack.txz

      - name: Generate profile.json files
        run: |
          DESC="Proton 11.0-2 arm64ec (bionic), GameNative ${PROTON_WINE_REF:0:7} + fixed-address syscall dispatcher for native ARM64 apps (patches/). SDK 28. Needs a fresh arm64ec container; 4KB-page kernels only (see README)."
          for t in Proton Wine; do
            [ $t = Proton ] && out=profile.json code=1 || { out=profile-wine.json; code=0; }
            cat > $GITHUB_WORKSPACE/$out << EOF
          {
            "type": "$t",
            "versionName": "${PROTON_VERSION}-${ARCH_NAME}",
            "versionCode": $code,
            "description": "$DESC",
            "files": [],
            "wine": {
              "binPath": "bin",
              "libPath": "lib",
              "prefixPack": "prefixPack.txz"
            }
          }
          EOF
          done
          cat $GITHUB_WORKSPACE/profile.json

      - name: Package
        run: |
          cd $HOME/compiled-files-aarch64
          cp $GITHUB_WORKSPACE/prefixPack.txz .
          cp $GITHUB_WORKSPACE/profile.json .
          tar -I 'zstd -T0 -19' -cf $GITHUB_WORKSPACE/proton-$PROTON_VERSION-$ARCH_NAME.wcp bin lib share prefixPack.txz profile.json
          cp $GITHUB_WORKSPACE/profile-wine.json profile.json
          tar cJf $GITHUB_WORKSPACE/proton-wine-$PROTON_VERSION-$ARCH_NAME.wcp.xz bin lib share prefixPack.txz profile.json
          cd $GITHUB_WORKSPACE
          sha256sum *.wcp *.wcp.xz | tee SHA256SUMS
          ls -la *.wcp *.wcp.xz

      - name: Upload Proton .wcp (GameNative)
        uses: actions/upload-artifact@v4
        with:
          name: proton-${{ env.PROTON_VERSION }}-${{ env.ARCH_NAME }}
          path: proton-${{ env.PROTON_VERSION }}-${{ env.ARCH_NAME }}.wcp
          retention-days: 30

      - name: Upload Wine .wcp.xz (Winlator CMOD / Ludashi)
        uses: actions/upload-artifact@v4
        with:
          name: proton-wine-${{ env.PROTON_VERSION }}-${{ env.ARCH_NAME }}
          path: proton-wine-${{ env.PROTON_VERSION }}-${{ env.ARCH_NAME }}.wcp.xz
          retention-days: 30

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: proton-${{ env.PROTON_VERSION }}-${{ env.ARCH_NAME }}-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Proton 11.0-2 arm64ec + syscall dispatcher fix (build ${{ github.run_number }})
          prerelease: true
          files: |
            proton-${{ env.PROTON_VERSION }}-${{ env.ARCH_NAME }}.wcp
            proton-wine-${{ env.PROTON_VERSION }}-${{ env.ARCH_NAME }}.wcp.xz
            SHA256SUMS
          body: |
            Test build. Use at your own risk.

            Sources: [${{ env.PROTON_WINE_REPO }}@${{ env.PROTON_WINE_REF }}](https://github.com/${{ env.PROTON_WINE_REPO }}/commit/${{ env.PROTON_WINE_REF }}) (same commit as GameNative release `proton-11.0-2-20261010`), built with GameNative's arm64ec build script, plus:
            - `ntdll: Use a fixed address for the syscall dispatcher pointer on aarch64` (patches/0001-ntdll-fixed-address-syscall-dispatcher-aarch64.patch)

            Built from ${{ github.repository }}@${{ github.sha }}.

            - `proton-${{ env.PROTON_VERSION }}-${{ env.ARCH_NAME }}.wcp`: Proton type, for GameNative
            - `proton-wine-${{ env.PROTON_VERSION }}-${{ env.ARCH_NAME }}.wcp.xz`: Wine type, for Winlator CMOD & Ludashi
