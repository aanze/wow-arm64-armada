name: Delete a release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to delete (the tag is deleted too)
        required: true

jobs:
  delete:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Delete release ${{ inputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
